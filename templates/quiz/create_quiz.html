{% extends "base.html" %}

{% block title %}Create Quiz - {{ course.title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">
                        <i class="bx bx-plus-circle text-primary"></i> Create New Quiz
                        <small class="text-muted d-block">Course: {{ course.title }}</small>
                    </h2>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label">Quiz Title</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                            <div class="form-text">Provide a brief description of what this quiz is about.</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('view_course', course_id=course.id) }}" class="btn btn-outline-secondary text-nowrap">
                                <i class="bx bx-arrow-back"></i> Back to Course
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bx bx-plus"></i> Create Quiz
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
