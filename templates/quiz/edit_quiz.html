{% extends "base.html" %}

{% block title %}Edit Quiz{% endblock %}

{% block styles %}
<style>
.btn-sm {
    padding: 0.15rem 0.3rem;
    font-size: 12px;
    line-height: 1;
}
.h2 .bx {
    font-size: 14px;
    vertical-align: -2px;
}
.modal-header {
    padding: 0.5rem 1rem;
}
.modal-body {
    padding: 0.75rem 1rem;
}
.modal-footer {
    padding: 0.25rem 0.5rem;
}
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">
            <i class="bx bx-edit text-primary"></i> Edit Quiz
        </h1>
        <a href="{{ url_for('view_quiz', quiz_id=quiz.id) }}" class="btn btn-outline-secondary btn-sm">
            Back
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="title" class="form-label small">Title</label>
                    <input type="text" class="form-control form-control-sm" id="title" name="title" value="{{ quiz.title }}" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label small">Description (Optional)</label>
                    <textarea class="form-control form-control-sm" id="description" name="description" rows="3">{{ quiz.description }}</textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-sm">
                        Save
                    </button>
                    <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="modal" data-bs-target="#deleteModal">
                        Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h5 class="modal-title h6 mb-0">Delete Quiz</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body small">
                Are you sure you want to delete this quiz? This action cannot be undone.
            </div>
            <div class="modal-footer py-1">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
                    Cancel
                </button>
                <form action="{{ url_for('delete_quiz', quiz_id=quiz.id) }}" method="POST" style="display: inline;">
                    <button type="submit" class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
